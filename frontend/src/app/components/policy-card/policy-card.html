<mat-card class="pg-card pg-policy-card" [routerLink]="['/policy-details', policy.id]">
  <div class="pg-policy-card__header">
    <span class="pg-status" [ngClass]="'pg-status--' + policy.status">{{ policy.status }}</span>
    <button mat-icon-button (click)="onSave($event)" aria-label="Save policy">
      <mat-icon>{{ policy.isSaved ? 'bookmark' : 'bookmark_border' }}</mat-icon>
    </button>
  </div>

  <mat-card-content>
    <h3 class="pg-policy-card__title">{{ policy.title }}</h3>
    <p class="pg-policy-card__desc">{{ policy.description }}</p>

    <div class="pg-policy-card__meta">
      <span><mat-icon>account_balance</mat-icon> {{ policy.department }}</span>
      <span><mat-icon>place</mat-icon> {{ policy.state }}</span>
    </div>

    <div class="pg-policy-card__tags">
      <mat-chip-set>
        <mat-chip>{{ policy.category }}</mat-chip>
      </mat-chip-set>
    </div>
  </mat-card-content>

  <mat-card-actions class="pg-policy-card__actions">
    <span class="pg-text-muted pg-view-count"><mat-icon>visibility</mat-icon> {{ policy.viewCount | number }}</span>
    <button mat-button color="primary" [routerLink]="['/policy-details', policy.id]" (click)="$event.stopPropagation()">
      View Details <mat-icon iconPositionEnd>arrow_forward</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
