server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to serve the exact file requested first, then a matching
        # folder, and only fall back to index.html if neither exists.
        # This one line is the entire fix for Angular's client-side
        # routing — without it, refreshing the browser on any route
        # other than "/" returns a 404 from nginx itself, since nginx
        # has no idea "/citizen-dashboard" is a route Angular's own
        # JavaScript router handles, not a real file on disk.
        try_files $uri $uri/ /index.html;
    }
}