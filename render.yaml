databases:
  - name: policygpt-db
    databaseName: policygpt
    plan: free

services:
  - type: web
    name: team3-policygpt-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: policygpt-db
          property: connectionString
      - key: PORT
        value: 8000
