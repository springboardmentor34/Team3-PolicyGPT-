<mat-toolbar class="pg-navbar">
  <div class="pg-navbar__inner pg-container">
    <a routerLink="/home" class="pg-brand" (click)="closeMobileMenu()">
      <mat-icon class="pg-brand__icon">account_balance</mat-icon>
      <span class="pg-brand__text">
        Policy<span class="pg-brand__accent">GPT</span>
      </span>
    </a>

    <nav class="pg-nav-links">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          class="pg-nav-link"
        >{{ link.label }}</a>
      }
    </nav>

    <div class="pg-navbar__actions">
      <button mat-icon-button routerLink="/notifications" matTooltip="Notifications" aria-label="Notifications">
        <mat-icon [matBadge]="unreadNotifications" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
      </button>

      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Account menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/profile"><mat-icon>person</mat-icon> Profile</a>
        <a mat-menu-item routerLink="/citizen-dashboard"><mat-icon>dashboard</mat-icon> Dashboard</a>
        <a mat-menu-item routerLink="/login"><mat-icon>logout</mat-icon> Logout</a>
      </mat-menu>

      <button mat-stroked-button routerLink="/login" class="pg-btn-outline">Login</button>
      <button mat-raised-button routerLink="/register" class="pg-btn-primary">Register</button>

      <button mat-icon-button class="pg-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <mat-icon>{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen) {
    <div class="pg-mobile-menu">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" (click)="closeMobileMenu()" routerLinkActive="active">{{ link.label }}</a>
      }
      <a routerLink="/notifications" (click)="closeMobileMenu()">Notifications</a>
      <a routerLink="/profile" (click)="closeMobileMenu()">Profile</a>
      <a routerLink="/login" (click)="closeMobileMenu()">Login</a>
      <a routerLink="/register" (click)="closeMobileMenu()">Register</a>
    </div>
  }
</mat-toolbar>
